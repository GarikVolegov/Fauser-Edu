components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [student, teacher, segreteria, admin]
        indirizzo:
          type: ["string", "null"]
        classId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - email
        - firstName
        - lastName
        - role
        - createdAt

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        indirizzo:
          type: ["string", "null"]

    Class:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        anno:
          type: integer
        sezione:
          type: string
        indirizzo:
          type: string
          enum: [informatica, logistica, aeronautica]
        teacherId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - anno
        - sezione
        - indirizzo
        - createdAt

    ClassInput:
      type: object
      properties:
        name:
          type: string
        anno:
          type: integer
        sezione:
          type: string
        indirizzo:
          type: string
          enum: [informatica, logistica, aeronautica]
        teacherId:
          type: ["integer", "null"]
      required:
        - name
        - anno
        - sezione
        - indirizzo

    ClassUpdate:
      type: object
      properties:
        name:
          type: string
        anno:
          type: integer
        sezione:
          type: string
        indirizzo:
