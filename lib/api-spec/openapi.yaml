openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Fauser Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: classes
    description: Class management
  - name: subjects
    description: Subject management
  - name: grades
    description: Registro elettronico - grades
  - name: attendance
    description: Registro elettronico - attendance
  - name: assignments
    description: Classroom - assignments
  - name: materials
    description: Classroom - study materials
  - name: events
    description: Calendar events
  - name: announcements
    description: School announcements
  - name: dashboard
    description: Dashboard summaries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [student, teacher, admin]
        - name: classId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List all classes
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Update a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassUpdate"
      responses:
        "200":
          description: Updated class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List all subjects
      parameters:
        - name: indirizzo
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"

  /grades:
    get:
      operationId: listGrades
      tags: [grades]
      summary: List grades
      parameters:
        - name: studentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: classId
          in: query
          schema:
            type: ["integer", "null"]
        - name: subjectId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
    post:
      operationId: createGrade
      tags: [grades]
      summary: Create a grade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeInput"
      responses:
        "201":
          description: Created grade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grade"

  /grades/{id}:
    patch:
      operationId: updateGrade
      tags: [grades]
      summary: Update a grade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeUpdate"
      responses:
        "200":
          description: Updated grade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grade"
    delete:
      operationId: deleteGrade
      tags: [grades]
      summary: Delete a grade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /grades/summary:
    get:
      operationId: getGradesSummary
      tags: [grades]
      summary: Get grades summary by subject
      parameters:
        - name: studentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Grades summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeSummary"

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: studentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: classId
          in: query
          schema:
            type: ["integer", "null"]
        - name: date
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Record attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Attendance record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  /attendance/{id}:
    patch:
      operationId: updateAttendance
      tags: [attendance]
      summary: Update attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdate"
      responses:
        "200":
          description: Updated attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      tags: [attendance]
      summary: Get attendance summary
      parameters:
        - name: studentId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      parameters:
        - name: classId
          in: query
          schema:
            type: ["integer", "null"]
        - name: subjectId
          in: query
          schema:
            type: ["integer", "null"]
        - name: upcoming
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    patch:
      operationId: updateAssignment
      tags: [assignments]
      summary: Update an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentUpdate"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List study materials
      parameters:
        - name: classId
          in: query
          schema:
            type: ["integer", "null"]
        - name: subjectId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Upload a material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Created material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"

  /materials/{id}:
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Delete a material
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List calendar events
      parameters:
        - name: from
          in: query
          schema:
            type: ["string", "null"]
        - name: to
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List school announcements
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    get:
      operationId: getAnnouncement
      tags: [announcements]
      summary: Get an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary for current user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/upcoming:
    get:
      operationId: getUpcomingItems
      tags: [dashboard]
      summary: Get upcoming assignments and events
      responses:
        "200":
          description: Upcoming items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingItems"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [student, teacher, admin]
        indirizzo:
          type: ["string", "null"]
        classId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - email
        - firstName
        - lastName
        - role
        - createdAt

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        indirizzo:
          type: ["string", "null"]

    Class:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        anno:
          type: integer
        sezione:
          type: string
        indirizzo:
          type: string
          enum: [informatica, logistica, aeronautica]
        teacherId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - anno
        - sezione
        - indirizzo
        - createdAt

    ClassInput:
      type: object
      properties:
        name:
          type: string
        anno:
          type: integer
        sezione:
          type: string
        indirizzo:
          type: string
          enum: [informatica, logistica, aeronautica]
        teacherId:
          type: ["integer", "null"]
      required:
        - name
        - anno
        - sezione
        - indirizzo

    ClassUpdate:
      type: object
      properties:
        name:
          type: string
        anno:
          type: integer
        sezione:
          type: string
        indirizzo:
          type: string
          enum: [informatica, logistica, aeronautica]
        teacherId:
          type: ["integer", "null"]

    Subject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        indirizzo:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
      required:
        - id
        - name

    SubjectInput:
      type: object
      properties:
        name:
          type: string
        indirizzo:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
      required:
        - name

    Grade:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        subjectId:
          type: integer
        subjectName:
          type: string
        value:
          type: number
        type:
          type: string
          enum: [orale, scritto, pratico]
        description:
          type: ["string", "null"]
        date:
          type: string
        teacherId:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - studentId
        - subjectId
        - subjectName
        - value
        - type
        - date
        - teacherId
        - createdAt

    GradeInput:
      type: object
      properties:
        studentId:
          type: integer
        subjectId:
          type: integer
        value:
          type: number
        type:
          type: string
          enum: [orale, scritto, pratico]
        description:
          type: ["string", "null"]
        date:
          type: string
      required:
        - studentId
        - subjectId
        - value
        - type
        - date

    GradeUpdate:
      type: object
      properties:
        value:
          type: number
        type:
          type: string
          enum: [orale, scritto, pratico]
        description:
          type: ["string", "null"]
        date:
          type: string

    GradeSummary:
      type: object
      properties:
        subjectId:
          type: integer
        subjectName:
          type: string
        average:
          type: number
        count:
          type: integer
        min:
          type: number
        max:
          type: number
      required:
        - subjectId
        - subjectName
        - average
        - count
        - min
        - max

    Attendance:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        classId:
          type: integer
        date:
          type: string
        status:
          type: string
          enum: [presente, assente, ritardo, uscita_anticipata]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - studentId
        - classId
        - date
        - status
        - createdAt

    AttendanceInput:
      type: object
      properties:
        studentId:
          type: integer
        classId:
          type: integer
        date:
          type: string
        status:
          type: string
          enum: [presente, assente, ritardo, uscita_anticipata]
        note:
          type: ["string", "null"]
      required:
        - studentId
        - classId
        - date
        - status

    AttendanceUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [presente, assente, ritardo, uscita_anticipata]
        note:
          type: ["string", "null"]

    AttendanceSummary:
      type: object
      properties:
        total:
          type: integer
        presenti:
          type: integer
        assenti:
          type: integer
        ritardi:
          type: integer
        usciteAnticipate:
          type: integer
        percentualePresenza:
          type: number
      required:
        - total
        - presenti
        - assenti
        - ritardi
        - usciteAnticipate
        - percentualePresenza

    Assignment:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        subjectId:
          type: integer
        subjectName:
          type: string
        classId:
          type: integer
        className:
          type: string
        dueDate:
          type: string
        teacherId:
          type: integer
        attachmentUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - subjectId
        - subjectName
        - classId
        - className
        - dueDate
        - teacherId
        - createdAt

    AssignmentInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        subjectId:
          type: integer
        classId:
          type: integer
        dueDate:
          type: string
        attachmentUrl:
          type: ["string", "null"]
      required:
        - title
        - subjectId
        - classId
        - dueDate

    AssignmentUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        dueDate:
          type: string
        attachmentUrl:
          type: ["string", "null"]

    Material:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        subjectId:
          type: integer
        subjectName:
          type: string
        classId:
          type: integer
        className:
          type: string
        fileUrl:
          type: string
        fileType:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        uploadedById:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - title
        - subjectId
        - subjectName
        - classId
        - className
        - fileUrl
        - uploadedById
        - createdAt

    MaterialInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        subjectId:
          type: integer
        classId:
          type: integer
        fileUrl:
          type: string
        fileType:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
      required:
        - title
        - subjectId
        - classId
        - fileUrl

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        allDay:
          type: boolean
        type:
          type: string
          enum: [compito, esame, evento_scolastico, vacanza, altro]
        classId:
          type: ["integer", "null"]
        createdById:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - title
        - startDate
        - allDay
        - type
        - createdById
        - createdAt

    EventInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        allDay:
          type: boolean
        type:
          type: string
          enum: [compito, esame, evento_scolastico, vacanza, altro]
        classId:
          type: ["integer", "null"]
      required:
        - title
        - startDate
        - allDay
        - type

    EventUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        startDate:
